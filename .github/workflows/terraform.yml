# Name of the workflow as it appears in the GitHub Actions tab
name: "Terraform Modular Deployment"

# Controls when the workflow will run
on:
  push:
    # Triggers the workflow on push events to the main branch
    branches:
      - main
  pull_request:
    # Triggers the workflow on pull request events targeted at the main branch
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Run"
    # Specifies the virtual machine environment to execute the steps
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checks out your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Installs and configures Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false

      # Step 3: Configures AWS credentials from GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 4: Initializes Terraform
      - name: Terraform Init
        run: terraform init

      # Step 5: Checks whether all Terraform code is formatted properly
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Step 6: Generates an execution plan
      - name: Terraform Plan
        run: terraform plan -no-color

      # Step 7: Applies the changes to AWS infrastructure (only on push to main)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve